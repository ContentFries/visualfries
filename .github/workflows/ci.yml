name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm exec vitest run

      # Projects without a cut list must render exactly as on main: render both builds here, on
      # the same Chromium and ffmpeg, and compare file bytes and manifests.
      - name: Legacy inserts against main
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/vf-main"
          git archive FETCH_HEAD dist static/demo/quote package.json | tar -x -C "$RUNNER_TEMP/vf-main"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/vf-main/node_modules"
          VF_MAIN_ROOT="$RUNNER_TEMP/vf-main" pnpm exec vitest run tests/motion/inserts-legacy.test.ts

      - name: Build package and site
        run: pnpm build

  # Functions a pull request changes must stay at CRAP 30 or below (crap.config.json, AGENTS.md).
  crap:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: CRAP score of changed functions
        shell: bash -o pipefail {0}
        run: pnpm exec crap-check --base "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
