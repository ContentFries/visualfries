name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Existing VisualFries release version to publish (for example, 0.3.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() && (
          (github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.release_created == 'true') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('visualfries-v{0}', inputs.version) || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify manual release version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: test "$(node -p \"require('./package.json').version\")" = "$EXPECTED_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Publish to npm
        run: npm publish
